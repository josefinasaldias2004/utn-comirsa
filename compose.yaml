services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Defini SQL_PASSWORD en .env}
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  init:
    build:
      context: .
      dockerfile: backend/Conecta.Api/Dockerfile
    command: ["--init-db"]
    environment:
      ConnectionStrings__Default: "Server=sql;Database=Conecta;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      sql:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Conecta.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sql;Database=Conecta;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      DataProtection__Path: /keys
    volumes: ["data-protection:/keys"]
    depends_on:
      init:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes:
  sql-data:
  data-protection:
